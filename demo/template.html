<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>消失的母校 · Memo-Map 4D（STE Schema v0.1）</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{
  --paper:#f6f0e2; --paper-light:#fbf7ec; --paper-dark:#ece2c9;
  --ink:#2b2620; --ink-soft:#5c5344; --ink-faint:#8a7d67;
  --seal:#b3452e; --seal-dark:#8f3520; --gold:#a97f2f; --teal:#33656d; --ok:#4a6741;
}
*{box-sizing:border-box}
html,body,#app{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
#app{display:flex;flex-direction:column;overflow:hidden}
.serif{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif}
.mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace}

/* ---------- 顶栏 ---------- */
header{position:relative;z-index:1150;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px;border-bottom:1px solid rgba(43,38,32,.1);background:var(--paper);flex:none;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .sealbox{width:38px;height:38px;border-radius:6px;background:var(--seal);color:var(--paper-light);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;box-shadow:0 2px 6px rgba(43,38,32,.3)}
.brand h1{margin:0;font-size:18px;line-height:1.2}
.brand h1 .sub{margin-left:8px;font-size:12px;font-weight:400;color:var(--ink-faint)}
.head-right{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ink-faint);flex-wrap:wrap}
.badge-schema{display:flex;align-items:center;gap:6px;background:rgba(51,101,109,.1);color:var(--teal);border-radius:9999px;padding:4px 10px;border:1px solid rgba(51,101,109,.25)}
.badge-schema a{color:var(--teal);text-decoration:none}
.badge-schema a:hover{text-decoration:underline}

/* ---------- 主区 ---------- */
main{position:relative;flex:1;overflow:hidden}
#map{position:absolute;inset:0;background:#ece8db}
.leaflet-container{background:#ece8db}

/* 标记 */
.mm-icon{background:transparent;border:none}
.mm-marker{position:relative;width:30px;height:30px}
.mm-marker-count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper-light);border:2px solid var(--ink);border-radius:9999px;font-family:'Noto Serif SC',serif;font-weight:700;font-size:12px;color:var(--ink);box-shadow:0 2px 8px rgba(43,38,32,.28);transition:transform .15s}
.mm-marker:hover .mm-marker-count{transform:scale(1.15)}
.mm-marker--gone .mm-marker-count{border-color:var(--seal);color:var(--seal)}
.mm-marker--alive .mm-marker-count{border-color:var(--ok);color:var(--ok)}
.mm-marker--resumed .mm-marker-count{border-color:var(--gold);color:var(--gold)}
.mm-marker--sel .mm-marker-count{background:var(--seal);color:var(--paper-light);border-color:#7d2d1b}
.mm-marker--ghost{opacity:.25;filter:grayscale(.8)}
.mm-marker-name{position:absolute;top:34px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(251,247,236,.94);border:1px solid rgba(43,38,32,.28);border-radius:9999px;padding:1px 8px;font-size:11px;letter-spacing:.03em;box-shadow:0 1px 4px rgba(43,38,32,.16);pointer-events:none}

/* 面板通用 */
.panel{background:radial-gradient(1200px 400px at 20% -10%,rgba(255,252,240,.9),transparent 60%),rgba(251,247,236,.97);border:1px solid rgba(43,38,32,.18);box-shadow:0 10px 40px rgba(43,38,32,.18),0 2px 8px rgba(43,38,32,.1);backdrop-filter:blur(6px);border-radius:16px}
.scroll::-webkit-scrollbar{width:8px;height:8px}
.scroll::-webkit-scrollbar-thumb{background:rgba(43,38,32,.25);border-radius:8px}
.scroll::-webkit-scrollbar-track{background:transparent}

/* 顶部筛选 chips */
#filters{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:1050;display:flex;align-items:center;gap:4px;background:rgba(251,247,236,.95);border:1px solid rgba(43,38,32,.1);border-radius:9999px;padding:4px;box-shadow:0 2px 10px rgba(43,38,32,.12);backdrop-filter:blur(6px);max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
#filters::-webkit-scrollbar{display:none}
#filters .lbl{padding-left:8px;font-size:10px;letter-spacing:.15em;color:var(--ink-faint);white-space:nowrap}
#filters button{border:none;background:none;cursor:pointer;border-radius:9999px;padding:4px 12px;font-size:12px;color:var(--ink-soft);white-space:nowrap}
#filters button.on{background:var(--seal);color:var(--paper-light)}

/* 图例 */
#legend{position:absolute;top:12px;right:16px;z-index:1050;padding:10px 14px;font-size:11px;line-height:1.8;color:var(--ink-soft)}
#legend h4{margin:0 0 2px;font-size:12px;color:var(--ink)}
.leg-dot{display:inline-block;width:10px;height:10px;border-radius:9999px;border:2px solid var(--ink);background:var(--paper-light);margin-right:6px;vertical-align:-1px}
.leg-dot--gone{border-color:var(--seal);color:var(--seal);background:var(--seal)}
.leg-dot--alive{border-color:var(--ok);color:var(--ok);background:var(--ok)}
.leg-dot--resumed{border-color:var(--gold);color:var(--gold);background:var(--gold)}

/* 左侧控制面板 */
#ctrl{position:absolute;top:60px;left:16px;bottom:16px;width:290px;z-index:1040;display:flex;flex-direction:column;overflow:hidden;transition:transform .25s ease}
#ctrl.collapsed{transform:translateX(calc(-100% - 24px))}
#ctrl-head{padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(43,38,32,.08)}
#ctrl-head h3{margin:0;font-size:14px}
#ctrl-head .x{background:none;border:none;cursor:pointer;color:var(--ink-faint);font-size:14px;padding:2px 6px}
#ctrl-body{flex:1;overflow-y:auto;padding:10px 12px}
.group-title{font-size:10px;letter-spacing:.2em;color:var(--ink-faint);margin:12px 0 6px;text-transform:uppercase}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid rgba(43,38,32,.18);background:var(--paper-light);border-radius:9999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink-soft)}
.seg button.on{background:var(--ink);color:var(--paper-light);border-color:var(--ink)}
#search{width:100%;margin-top:8px;padding:6px 10px;border:1px solid rgba(43,38,32,.2);border-radius:9999px;background:var(--paper-light);font-size:12px;color:var(--ink);outline:none}
#search:focus{border-color:var(--teal)}
.school-list{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.school-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px;border:1px solid transparent;transition:background .12s}
.school-item:hover{background:rgba(43,38,32,.05)}
.school-item.sel{background:rgba(179,69,46,.08);border-color:rgba(179,69,46,.3)}
.school-item .dot{width:8px;height:8px;border-radius:9999px;flex:none}
.dot--gone{background:var(--seal)}
.dot--alive{background:var(--ok)}
.dot--resumed{background:var(--gold)}
.school-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.school-item .yr{color:var(--ink-faint);font-size:11px;flex:none}
.school-item .badge{font-size:10px;padding:1px 6px;border-radius:9999px;background:rgba(43,38,32,.07);color:var(--ink-soft);flex:none}
.school-item .badge.k-gone{background:rgba(179,69,46,.1);color:var(--seal)}
.school-item .badge.k-move{background:rgba(169,127,47,.12);color:var(--gold)}
.school-item .badge.k-rename{background:rgba(51,101,109,.12);color:var(--teal)}
.collapse-btn{position:absolute;top:60px;left:306px;z-index:1040;border:1px solid rgba(43,38,32,.15);background:var(--paper-light);color:var(--ink-soft);border-radius:0 10px 10px 0;padding:8px 6px;cursor:pointer;font-size:12px;box-shadow:0 2px 8px rgba(43,38,32,.12);transition:left .25s ease}
.collapse-btn.open{left:16px;border-radius:10px}
#stats{position:absolute;bottom:16px;left:16px;z-index:1030;padding:8px 14px;font-size:11px;color:var(--ink-soft);background:rgba(251,247,236,.92);border:1px solid rgba(43,38,32,.12);border-radius:12px;box-shadow:0 2px 8px rgba(43,38,32,.1)}
#stats b{color:var(--ink);font-weight:600}
#stats .sep{color:var(--ink-faint)}

/* 详情抽屉 */
#detail{position:absolute;right:16px;top:60px;bottom:16px;width:380px;z-index:1040;display:none;flex-direction:column;overflow:hidden}
#detail.show{display:flex;animation:slideIn .28s cubic-bezier(.2,.8,.25,1) both}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
#detail-head{padding:14px 16px 10px;border-bottom:1px solid rgba(43,38,32,.08)}
#detail-head .kicker{font-size:10px;letter-spacing:.2em;color:var(--ink-faint)}
#detail-head h2{margin:2px 0 4px;font-size:17px}
#detail-head .aliases{font-size:11px;color:var(--ink-soft)}
#detail-head .steid{font-size:10px;color:var(--ink-faint);word-break:break-all;margin-top:4px;user-select:all}
#detail-head .x{position:absolute;top:10px;right:12px;background:none;border:none;cursor:pointer;color:var(--ink-faint);font-size:16px;padding:4px}
#detail-body{flex:1;overflow-y:auto;padding:12px 16px 20px}
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:rgba(43,38,32,.14)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item::before{content:'';position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:9999px;background:var(--paper-light);border:2px solid var(--ink)}
.tl-item.st-active::before{border-color:var(--ok)}
.tl-item.st-demolished::before{border-color:var(--seal);background:var(--seal)}
.tl-item.st-under_construction::before{border-color:var(--gold)}
.tl-item.st-proposed::before{border-color:var(--gold);border-style:dashed}
.tl-range{font-size:12px;font-weight:600;color:var(--ink)}
.tl-status{display:inline-block;font-size:10px;padding:1px 8px;border-radius:9999px;margin-left:6px;vertical-align:1px}
.tl-status.st-active{background:rgba(74,103,65,.12);color:var(--ok)}
.tl-status.st-demolished{background:rgba(179,69,46,.12);color:var(--seal)}
.tl-status.st-under_construction{background:rgba(169,127,47,.14);color:var(--gold)}
.tl-status.st-proposed{background:rgba(169,127,47,.14);color:var(--gold)}
.tl-name{font-size:12px;color:var(--ink-soft);margin:2px 0}
.tl-desc{font-size:12px;line-height:1.65;color:var(--ink-soft)}
.tl-conf{font-size:11px;color:var(--ink-faint);margin-top:3px}
.conf-bar{display:inline-block;width:54px;height:5px;border-radius:3px;background:rgba(43,38,32,.1);vertical-align:1px;overflow:hidden}
.conf-bar i{display:block;height:100%;background:var(--teal);border-radius:3px}
.tags{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;padding:2px 10px;border-radius:9999px;background:rgba(43,38,32,.06);color:var(--ink-soft)}
.tag kbd{font-family:inherit;font-weight:600}
.note-box{margin-top:10px;font-size:11px;line-height:1.6;color:var(--gold);background:rgba(169,127,47,.08);border:1px solid rgba(169,127,47,.25);border-radius:8px;padding:8px 10px}
.data-foot{margin-top:14px;padding-top:10px;border-top:1px dashed rgba(43,38,32,.15);font-size:10px;color:var(--ink-faint);line-height:1.7}

/* 移动端适配 */
@media (max-width:760px){
  #ctrl{left:8px;width:calc(100vw - 16px);top:auto;bottom:0;height:45vh;border-radius:16px 16px 0 0}
  .collapse-btn{display:none}
  #detail{right:8px;left:8px;width:auto;top:auto;bottom:0;height:55vh;border-radius:16px 16px 0 0}
  #legend{display:none}
  #filters{top:8px;max-width:calc(100vw - 16px)}
  #stats{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="sealbox serif">忆</div>
      <h1 class="serif">消失的母校<span class="sub">Memo-Map 4D · 时间记忆地图</span></h1>
    </div>
    <div class="head-right">
      <span class="badge-schema">数据符合 <a href="https://wonderingWu.github.io/ste-schema/v0.1/schema.json" target="_blank">STE Schema v0.1</a></span>
      <span id="dataCount"></span>
    </div>
  </header>
  <main>
    <div id="map"></div>

    <div id="filters">
      <span class="lbl">年代</span>
      <button data-decade="all" class="on">全部</button>
      <span id="decadeChips"></span>
      <span class="lbl" style="margin-left:10px">状态</span>
      <button data-status="all" class="on">全部</button>
      <button data-status="gone">已消失</button>
      <button data-status="alive">仍存在</button>
    </div>

    <div id="legend" class="panel">
      <h4>图例</h4>
      <div><span class="leg-dot leg-dot--gone"></span>已消失（demolished）</div>
      <div><span class="leg-dot leg-dot--alive"></span>仍存在（active）</div>
      <div><span class="leg-dot leg-dot--resumed"></span>停办后恢复</div>
      <div style="margin-top:6px;color:var(--ink-faint)">数字 = 该年代活跃学校数</div>
    </div>

    <button class="collapse-btn" id="collapseBtn" title="收起/展开列表">‹</button>

    <div id="ctrl" class="panel">
      <div id="ctrl-head">
        <h3>学校名录 <span id="listCount" style="color:var(--ink-faint);font-weight:400"></span></h3>
        <button class="x" id="ctrlClose">✕</button>
      </div>
      <div id="ctrl-body" class="scroll">
        <div class="group-title">城市</div>
        <div class="seg" id="citySeg">
          <button data-city="all" class="on">全部</button>
          <button data-city="北京">北京</button>
          <button data-city="上海">上海</button>
        </div>
        <div class="group-title">消失类型</div>
        <div class="seg" id="kindSeg">
          <button data-kind="all" class="on">全部</button>
        </div>
        <div class="group-title">搜索</div>
        <input id="search" placeholder="输入校名查找…" />
        <div class="school-list" id="schoolList"></div>
      </div>
    </div>

    <div id="detail" class="panel">
      <button class="x" id="detailClose">✕</button>
      <div id="detail-head"></div>
      <div id="detail-body" class="scroll"></div>
    </div>

    <div id="stats"><b id="stCount"></b> 所学校 <span class="sep">·</span> <b id="stGone"></b> 已消失 <span class="sep">·</span> <b id="stAlive"></b> 仍存在 <span class="sep">·</span> 坐标 <b id="stGeo"></b> 已定位</div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
/* ============ 数据（由 build-demo.mjs 注入，符合 STE Schema v0.1） ============ */
const SCHOOLS = __STE_DATA__;

/* ============ 工具 ============ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtYear = (y) => y == null ? '至今' : y;
const KIND_LABEL = { '停办':'停办', '停办（老址停办）':'停办', '停办→恢复':'恢复', '停办（部分）':'停办', '更名/升级':'更名', '升级':'升级', '更名/并入':'更名', '搬迁':'搬迁', '搬迁（老址停办）':'搬迁', '搬迁/扩建':'搬迁', '合并':'合并', '停招':'停招', '停招（转制公办）':'转制' };
const KIND_CLS = { '停办':'k-gone', '恢复':'k-rename', '更名':'k-rename', '升级':'k-rename', '搬迁':'k-move', '合并':'k-gone', '停招':'k-move', '转制':'k-rename' };
const STATUS_ZH = { active:'存在', demolished:'已消失', under_construction:'在建', proposed:'规划' };

/* 学校当前状态: gone / alive / resumed */
function schoolState(e) {
  const last = e.timeline[e.timeline.length - 1];
  if (last.status === 'active' && last.end_date == null) {
    const kind = String(e.tags['ste:disappearance'] || '');
    return kind.includes('恢复') ? 'resumed' : 'alive';
  }
  return 'gone';
}
function schoolYearRange(e) {
  const s = e.timeline[0].start_date;
  const last = e.timeline[e.timeline.length - 1];
  const e2 = last.end_date ?? last.start_date;
  return s === e2 ? s : s + '–' + e2;
}
/* 在年代 decade（如 1970，表示 1970-1979）是否活跃 */
function aliveIn(e, decade) {
  if (decade === 'all') return true;
  return e.timeline.some((sn) => sn.status === 'active' && parseInt(sn.start_date, 10) <= decade + 9 && (sn.end_date == null || parseInt(sn.end_date, 10) >= decade));
}
function kindOf(e) { return String(e.tags['ste:disappearance'] || '未知').replace(/（.*?）/g, ''); }

/* ============ 状态 ============ */
const S = { decade: 'all', status: 'all', city: 'all', kind: 'all', query: '', sel: null };
let map = null, markerLayer = null, detailLayer = null;

/* ============ 地图 ============ */
function initMap() {
  map = L.map('map', { zoomControl: true }).setView([34.5, 114.5], 5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
}

function markerIcon(e, sel) {
  const st = schoolState(e);
  const cls = sel ? 'mm-marker--sel' : (st === 'gone' ? 'mm-marker--gone' : st === 'resumed' ? 'mm-marker--resumed' : 'mm-marker--alive');
  const count = sel ? '×' : String(e.timeline.length);
  return L.divIcon({
    className: 'mm-icon',
    html: '<div class="mm-marker ' + cls + '"><div class="mm-marker-count">' + count + '</div><div class="mm-marker-name">' + esc(e.name.primary) + '</div></div>',
    iconSize: [30, 30], iconAnchor: [15, 15],
  });
}

function renderMarkers() {
  markerLayer.clearLayers();
  const visible = visibleSchools();
  for (const e of visible) {
    const m = L.marker([e.coordinates.lat, e.coordinates.lon], { icon: markerIcon(e, S.sel === e.ste_id) });
    m.on('click', () => openDetail(e));
    markerLayer.addLayer(m);
  }
  if (visible.length === 1) map.setView([visible[0].coordinates.lat, visible[0].coordinates.lon], 12);
  else if (visible.length > 0) {
    const bounds = L.latLngBounds(visible.map((e) => [e.coordinates.lat, e.coordinates.lon]));
    map.fitBounds(bounds, { padding: [60, 60], maxZoom: 12 });
  } else {
    map.setView([34.5, 114.5], 5);
  }
}

/* ============ 筛选 ============ */
function visibleSchools() {
  return SCHOOLS.filter((e) => {
    if (S.decade !== 'all' && !aliveIn(e, S.decade)) return false;
    if (S.status === 'gone' && schoolState(e) === 'alive') return false;
    if (S.status === 'alive' && schoolState(e) !== 'alive') return false;
    if (S.city !== 'all' && e.tags.city !== S.city) return false;
    if (S.kind !== 'all' && kindOf(e) !== S.kind) return false;
    if (S.query && !(e.name.primary + ' ' + (e.name.aliases || []).join(' ')).includes(S.query)) return false;
    return true;
  });
}

function renderList() {
  const v = visibleSchools();
  const box = $('schoolList');
  box.innerHTML = '';
  for (const e of v) {
    const st = schoolState(e);
    const kind = kindOf(e);
    const div = document.createElement('div');
    div.className = 'school-item' + (S.sel === e.ste_id ? ' sel' : '');
    div.innerHTML =
      '<span class="dot dot--' + st + '"></span>' +
      '<span class="nm">' + esc(e.name.primary) + '</span>' +
      '<span class="badge ' + (KIND_CLS[kind] || '') + '">' + esc(KIND_LABEL[e.tags['ste:disappearance']] || kind) + '</span>' +
      '<span class="yr">' + schoolYearRange(e) + '</span>';
    div.onclick = () => openDetail(e);
    box.appendChild(div);
  }
  $('listCount').textContent = '(' + v.length + '/' + SCHOOLS.length + ')';
}

function renderStats() {
  $('dataCount').textContent = SCHOOLS.length + ' 所学校 · ' + new Set(SCHOOLS.map((e) => e.tags.city)).size + ' 城';
  $('stCount').textContent = SCHOOLS.length;
  $('stGone').textContent = SCHOOLS.filter((e) => schoolState(e) === 'gone').length;
  $('stAlive').textContent = SCHOOLS.filter((e) => schoolState(e) !== 'gone').length;
  $('stGeo').textContent = SCHOOLS.filter((e) => !(e.tags && e.tags.note)).length;
}

/* ============ 详情 ============ */
function openDetail(e) {
  S.sel = e.ste_id;
  $('detailClose').style.display = 'block';
  const head = $('detail-head');
  const kind = kindOf(e);
  const st = schoolState(e);
  head.innerHTML =
    '<div class="kicker">' + esc(e.tags.city) + ' · ' + esc(e.tags['ste:disappearance'] || '') + ' · ' + esc(kind) + '</div>' +
    '<h2 class="serif">' + esc(e.name.primary) + '</h2>' +
    (e.name.aliases && e.name.aliases.length ? '<div class="aliases">别称：' + e.name.aliases.map(esc).join(' / ') + '</div>' : '') +
    '<div class="steid mono">' + e.ste_id + '</div>';
  let body = '<div class="tl">';
  for (const sn of e.timeline) {
    const pct = Math.round((sn.confidence ?? 0.7) * 100);
    body +=
      '<div class="tl-item st-' + esc(sn.status) + '">' +
      '<div class="tl-range">' + esc(sn.start_date) + ' → ' + esc(fmtYear(sn.end_date)) + ' <span class="tl-status st-' + esc(sn.status) + '">' + (STATUS_ZH[sn.status] || sn.status) + '</span></div>' +
      '<div class="tl-name">' + esc(sn.name) + '</div>' +
      (sn.description ? '<div class="tl-desc">' + esc(sn.description) + '</div>' : '') +
      (sn.confidence != null ? '<div class="tl-conf">置信度 ' + pct + '% <span class="conf-bar"><i style="width:' + pct + '%"></i></span></div>' : '') +
      '</div>';
  }
  body += '</div>';
  body += '<div class="tags">' + Object.entries(e.tags || {}).map(([k, v]) => '<span class="tag"><kbd>' + esc(k) + '</kbd>=<span class="mono">' + esc(v) + '</span></span>').join('') + '</div>';
  if (e.tags && e.tags.note) {
    body += '<div class="note-box">⚠️ ' + esc(e.tags.note) + '</div>';
  }
  body += '<div class="data-foot">STE Schema v0.1 · ste_id 为稳定 UUID · timeline 快照按时间升序 · 停办/搬迁/更名以快照状态表达<br/>schema: <span class="mono">wonderingWu.github.io/ste-schema/v0.1/schema.json</span></div>';
  $('detail-body').innerHTML = body;
  $('detail').classList.add('show');
  renderMarkers();
  renderList();
}

function closeDetail() {
  $('detail').classList.remove('show');
  S.sel = null;
  renderMarkers();
  renderList();
}

/* ============ 绑定 ============ */
function bindFilters() {
  const chipsBox = $('decadeChips');
  const years = [];
  for (const e of SCHOOLS) for (const sn of e.timeline) {
    const y = parseInt(sn.start_date, 10);
    if (!isNaN(y)) years.push(Math.floor(y / 10) * 10);
    if (sn.end_date) { const y2 = parseInt(sn.end_date, 10); if (!isNaN(y2)) years.push(Math.floor(y2 / 10) * 10); }
  }
  const range = [Math.min(...years), Math.max(...years)];
  for (let d = range[0]; d <= range[1]; d += 10) {
    const b = document.createElement('button');
    b.textContent = d + 's';
    b.dataset.decade = String(d);
    b.onclick = () => { S.decade = d; syncFilterUI(); renderMarkers(); renderList(); };
    chipsBox.appendChild(b);
  }

  const kinds = new Set(SCHOOLS.map((e) => kindOf(e)));
  const seg = $('kindSeg');
  for (const k of kinds) {
    const b = document.createElement('button');
    b.textContent = k;
    b.dataset.kind = k;
    b.onclick = () => { S.kind = k; syncFilterUI(); renderMarkers(); renderList(); };
    seg.appendChild(b);
  }

  document.querySelectorAll('#filters [data-decade]').forEach((b) => (b.onclick = () => { S.decade = b.dataset.decade === 'all' ? 'all' : parseInt(b.dataset.decade, 10); syncFilterUI(); renderMarkers(); renderList(); }));
  document.querySelectorAll('#filters [data-status]').forEach((b) => (b.onclick = () => { S.status = b.dataset.status; syncFilterUI(); renderMarkers(); renderList(); }));
  document.querySelectorAll('#citySeg [data-city]').forEach((b) => (b.onclick = () => { S.city = b.dataset.city; syncFilterUI(); renderMarkers(); renderList(); }));
  document.querySelectorAll('#kindSeg [data-kind]').forEach((b) => (b.onclick = () => { S.kind = b.dataset.kind; syncFilterUI(); renderMarkers(); renderList(); }));
  $('search').oninput = (ev) => { S.query = ev.target.value.trim(); renderMarkers(); renderList(); };
  $('ctrlClose').onclick = collapseCtrl;
  $('collapseBtn').onclick = () => { const c = $('ctrl'); const open = c.classList.contains('collapsed'); c.classList.toggle('collapsed'); $('collapseBtn').classList.toggle('open', open); $('collapseBtn').textContent = open ? '‹' : '›'; };
  $('detailClose').onclick = closeDetail;
}

function syncFilterUI() {
  const sel = (sel, val) => { document.querySelectorAll(sel).forEach((b) => b.classList.toggle('on', b.dataset.decade === String(val) || b.dataset.status === val || b.dataset.city === val || b.dataset.kind === val)); };
  sel('#filters [data-decade]', S.decade);
  sel('#filters [data-status]', S.status);
  sel('#citySeg [data-city]', S.city);
  sel('#kindSeg [data-kind]', S.kind);
}

/* ============ 启动 ============ */
initMap();
bindFilters();
renderStats();
renderMarkers();
renderList();
</script>
</body>
</html>
