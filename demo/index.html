<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>时空记忆地图 MemoMap 4D · 世界的时间维</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{
  --paper:#f6f0e2; --paper-light:#fbf7ec; --paper-dark:#ece2c9;
  --ink:#2b2620; --ink-soft:#5c5344; --ink-faint:#8a7d67;
  --seal:#b3452e; --seal-dark:#8f3520; --gold:#a97f2f; --teal:#33656d; --ok:#4a6741;
}
*{box-sizing:border-box}
html,body,#app{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
#app{display:flex;flex-direction:column;overflow:hidden}
.serif{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif}
.mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace}

/* ---------- 顶栏 ---------- */
header{position:relative;z-index:1150;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid rgba(43,38,32,.1);background:var(--paper);flex:none;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .sealbox{width:34px;height:34px;border-radius:6px;background:var(--seal);color:var(--paper-light);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;box-shadow:0 2px 6px rgba(43,38,32,.3)}
.brand h1{margin:0;font-size:15px;line-height:1.2}
.brand h1 .sub{margin-left:8px;font-size:11px;font-weight:400;color:var(--ink-faint)}
.proj-switch{display:flex;gap:4px;background:var(--paper-light);border:1px solid rgba(43,38,32,.15);border-radius:9999px;padding:3px}
.proj-switch button{border:none;background:none;cursor:pointer;border-radius:9999px;padding:5px 14px;font-size:12px;color:var(--ink-soft);white-space:nowrap}
.proj-switch button.on{background:var(--ink);color:var(--paper-light);font-weight:600}
.head-right{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-faint);flex-wrap:wrap}
.btn{border:1px solid rgba(43,38,32,.2);background:var(--paper-light);color:var(--ink);border-radius:9999px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all .12s}
.btn:hover{background:var(--ink);color:var(--paper-light)}
.btn.primary{background:var(--seal);color:var(--paper-light);border-color:var(--seal-dark)}
.btn.primary:hover{background:var(--seal-dark)}
.btn:disabled{opacity:.45;cursor:default}
.badge-schema{display:flex;align-items:center;gap:6px;background:rgba(51,101,109,.1);color:var(--teal);border-radius:9999px;padding:4px 10px;border:1px solid rgba(51,101,109,.25)}
.badge-schema a{color:var(--teal);text-decoration:none}
.badge-schema a:hover{text-decoration:underline}
.user-box{display:flex;align-items:center;gap:8px}
.user-chip{display:flex;align-items:center;gap:6px;background:rgba(169,127,47,.1);color:var(--gold);border:1px solid rgba(169,127,47,.3);border-radius:9999px;padding:4px 12px;font-size:12px}
.user-chip b{color:var(--ink);font-weight:600}
#projDesc{font-size:10.5px;color:var(--ink-faint);padding:0 4px 4px}

/* ---------- 主区 ---------- */
main{position:relative;flex:1;overflow:hidden}
#map{position:absolute;inset:0;background:#ece8db}
.leaflet-container{background:#ece8db}

/* 标记 */
.mm-icon{background:transparent;border:none}
.mm-marker{position:relative;width:34px;height:34px}
.mm-marker-count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper-light);border:2px solid var(--ink);border-radius:9999px;font-family:'Noto Serif SC',serif;font-weight:700;font-size:13px;color:var(--ink);box-shadow:0 2px 8px rgba(43,38,32,.28);transition:transform .15s}
.mm-marker:hover .mm-marker-count{transform:scale(1.14)}
.mm-marker--alive .mm-marker-count{border-color:var(--ok);color:var(--ok)}
.mm-marker--dead .mm-marker-count{border-color:var(--seal);color:var(--seal);opacity:.55;filter:grayscale(.5)}
.mm-marker--sel .mm-marker-count{background:var(--seal);color:var(--paper-light);border-color:#7d2d1b}
.mm-marker-name{position:absolute;top:38px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(251,247,236,.94);border:1px solid rgba(43,38,32,.28);border-radius:9999px;padding:1px 8px;font-size:11px;letter-spacing:.03em;box-shadow:0 1px 4px rgba(43,38,32,.16);pointer-events:none}
.mm-marker-name.ghost{display:none}
.you-marker{width:14px;height:14px;background:#3b82c4;border:3px solid #fff;border-radius:9999px;box-shadow:0 0 0 2px rgba(59,130,196,.5),0 2px 8px rgba(0,0,0,.3)}

/* 浮动层通用 */
.panel{background:radial-gradient(1200px 400px at 20% -10%,rgba(255,252,240,.9),transparent 60%),rgba(251,247,236,.97);border:1px solid rgba(43,38,32,.18);box-shadow:0 10px 40px rgba(43,38,32,.18),0 2px 8px rgba(43,38,32,.1);backdrop-filter:blur(6px);border-radius:16px}
.scroll::-webkit-scrollbar{width:8px;height:8px}
.scroll::-webkit-scrollbar-thumb{background:rgba(43,38,32,.25);border-radius:8px}
.scroll::-webkit-scrollbar-track{background:transparent}

#legend{position:absolute;top:12px;right:14px;z-index:1050;padding:8px 12px;font-size:11px;line-height:1.8;color:var(--ink-soft)}
#legend h4{margin:0 0 2px;font-size:12px;color:var(--ink)}
.leg-dot{display:inline-block;width:10px;height:10px;border-radius:9999px;border:2px solid var(--ink);background:var(--paper-light);margin-right:6px;vertical-align:-1px}
.leg-dot--alive{border-color:var(--ok);background:var(--ok)}
.leg-dot--dead{border-color:var(--seal);background:var(--seal);opacity:.55}
.leg-dot--you{border-color:#3b82c4;background:#3b82c4}
#locHint{position:absolute;top:12px;left:14px;z-index:1050;padding:6px 12px;font-size:11px;color:var(--ink-soft);display:none}
#locHint.show{display:block}

/* ---------- 底部时间轴 ---------- */
#timeline{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;z-index:1060;width:min(680px,calc(100vw - 24px));padding:10px 16px 12px}
#tlTop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
#tlYear{font-size:26px;font-weight:700;font-family:'Noto Serif SC',serif;color:var(--ink);line-height:1}
#tlYear small{font-size:12px;font-weight:400;color:var(--ink-faint);margin-left:4px}
#tlHint{font-size:11px;color:var(--ink-faint)}
#tlRange{width:100%;-webkit-appearance:none;appearance:none;height:28px;background:transparent;cursor:pointer;margin:0}
#tlRange::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--paper-dark),var(--ink))}
#tlRange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:9999px;background:var(--seal);border:3px solid var(--paper-light);box-shadow:0 1px 6px rgba(43,38,32,.4);margin-top:-6px}
#tlRange::-moz-range-track{height:6px;border-radius:3px;background:var(--paper-dark)}
#tlRange::-moz-range-thumb{width:16px;height:16px;border-radius:9999px;background:var(--seal);border:3px solid var(--paper-light);box-shadow:0 1px 6px rgba(43,38,32,.4)}
#tlEras{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-faint);margin-top:-6px;user-select:none}
#tlEras b{color:var(--ink-soft);font-weight:600}
#tlPlay{position:absolute;right:14px;top:-34px;border:none;background:rgba(179,69,46,.12);color:var(--seal);border-radius:9999px;padding:4px 12px;font-size:11px;cursor:pointer;border:1px solid rgba(179,69,46,.25)}
#tlPlay:hover{background:rgba(179,69,46,.22)}

/* ---------- 学校卡片 ---------- */
#card{position:absolute;right:14px;top:64px;bottom:86px;width:350px;z-index:1045;display:none;flex-direction:column;overflow:hidden}
#card.show{display:flex;animation:slideIn .25s cubic-bezier(.2,.8,.25,1) both}
@keyframes slideIn{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
#card-head{padding:14px 16px 10px;border-bottom:1px solid rgba(43,38,32,.08);position:relative}
#card-head .kicker{font-size:10px;letter-spacing:.18em;color:var(--ink-faint)}
#card-head h2{margin:2px 0 2px;font-size:16px}
#card-head .steid{font-size:9.5px;color:var(--ink-faint);word-break:break-all;user-select:all}
#card-head .x{position:absolute;top:8px;right:10px;background:none;border:none;cursor:pointer;color:var(--ink-faint);font-size:15px;padding:4px}
#card-body{flex:1;overflow-y:auto;padding:12px 16px 16px}
#curSnap{border-left:3px solid var(--seal);padding:2px 0 2px 12px;margin-bottom:12px}
#curSnap .when{font-size:10px;color:var(--ink-faint);letter-spacing:.12em}
#curSnap .what{font-size:13px;font-weight:600;margin-top:2px}
#curSnap .st{display:inline-block;font-size:10px;padding:1px 8px;border-radius:9999px;margin-left:6px;vertical-align:1px;background:rgba(74,103,65,.12);color:var(--ok)}
#curSnap .st.dead{background:rgba(179,69,46,.12);color:var(--seal)}
#curSnap .desc{font-size:12px;line-height:1.65;color:var(--ink-soft);margin-top:4px}
.subtitle{font-size:10px;letter-spacing:.2em;color:var(--ink-faint);margin:12px 0 6px}
.tl{position:relative;padding-left:20px}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:rgba(43,38,32,.14)}
.tl-item{position:relative;padding:0 0 12px;cursor:pointer}
.tl-item::before{content:'';position:absolute;left:-15px;top:4px;width:9px;height:9px;border-radius:9999px;background:var(--paper-light);border:2px solid var(--ink);transition:all .12s}
.tl-item.cur::before{background:var(--seal);border-color:var(--seal);transform:scale(1.35)}
.tl-item.st-active::before{border-color:var(--ok)}
.tl-item.st-demolished::before{border-color:var(--seal);background:var(--seal)}
.tl-range{font-size:11.5px;font-weight:600}
.tl-name{font-size:11.5px;color:var(--ink-soft);margin-top:1px}
.tl-status{display:inline-block;font-size:9.5px;padding:0 7px;border-radius:9999px;margin-left:5px;vertical-align:1px}
.tl-status.st-active{background:rgba(74,103,65,.12);color:var(--ok)}
.tl-status.st-demolished{background:rgba(179,69,46,.12);color:var(--seal)}
/* 记忆/贡献 */
#contribs{display:flex;flex-direction:column;gap:8px}
.contrib{border:1px dashed rgba(43,38,32,.22);border-radius:10px;padding:8px 10px;font-size:11.5px;line-height:1.6;color:var(--ink-soft)}
.contrib img{width:100%;border-radius:6px;margin-top:6px;border:1px solid rgba(43,38,32,.12)}
.contrib .c-head{display:flex;align-items:center;gap:6px;margin-bottom:2px;flex-wrap:wrap}
.contrib .c-type{font-size:9.5px;padding:0 7px;border-radius:9999px;background:rgba(51,101,109,.12);color:var(--teal)}
.contrib .c-year{font-size:10.5px;font-weight:600;color:var(--ink)}
.contrib .c-author{font-size:10px;color:var(--ink-faint)}
.contrib .c-acts{margin-left:auto;display:flex;gap:4px}
.contrib .c-act{border:1px solid rgba(43,38,32,.2);background:none;border-radius:9999px;padding:1px 8px;font-size:10px;cursor:pointer;color:var(--ink-soft)}
.contrib .c-act:hover{border-color:var(--teal);color:var(--teal)}
.contrib .c-act.done{background:rgba(74,103,65,.12);color:var(--ok);border-color:transparent;cursor:default}
.contrib .c-act.del:hover{border-color:var(--seal);color:var(--seal)}
.contrib .c-meta{font-size:10px;color:var(--ink-faint);margin-top:3px}
.contrib .c-price{display:inline-block;background:rgba(169,127,47,.1);color:var(--gold);border-radius:4px;padding:0 5px;font-size:10px;margin-left:4px}
#contribEmpty{font-size:11px;color:var(--ink-faint);border:1px dashed rgba(43,38,32,.15);border-radius:10px;padding:10px;text-align:center}

/* 表单 modal */
#modal{position:fixed;inset:0;z-index:1200;background:rgba(43,38,32,.42);display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#modalBox{width:min(420px,100%);max-height:88vh;overflow-y:auto;padding:18px 20px}
#modalBox h3{margin:0 0 4px;font-size:15px}
#modalBox .sub{font-size:11px;color:var(--ink-faint);margin-bottom:12px}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px}
.fld input[type=text],.fld input[type=number],.fld textarea,.fld select{width:100%;padding:7px 10px;border:1px solid rgba(43,38,32,.22);border-radius:8px;background:var(--paper-light);font-size:12.5px;color:var(--ink);outline:none}
.fld textarea{min-height:64px;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--teal)}
.fld .err{color:var(--seal);font-size:10.5px;margin-top:3px;display:none}
.fld.invalid input,.fld.invalid textarea{border-color:var(--seal)}
.fld.invalid .err{display:block}
.seg2{display:flex;gap:4px}
.seg2 button{flex:1;border:1px solid rgba(43,38,32,.18);background:var(--paper-light);border-radius:9999px;padding:6px 8px;font-size:12px;cursor:pointer;color:var(--ink-soft)}
.seg2 button.on{background:var(--ink);color:var(--paper-light);border-color:var(--ink)}
#imgPreview{margin-top:8px;display:none}
#imgPreview img{width:100%;border-radius:8px;border:1px solid rgba(43,38,32,.15)}
#imgPreview.show{display:block}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-actions .btn{flex:1;padding:8px}
.pts-note{font-size:10.5px;color:var(--teal);margin-top:6px;text-align:center}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:1300;background:var(--ink);color:var(--paper-light);font-size:12px;padding:8px 18px;border-radius:9999px;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#toast.show{opacity:1}

/* 移动端 */
@media (max-width:760px){
  #card{right:8px;left:8px;width:auto;top:auto;bottom:92px;height:52vh;border-radius:14px}
  #timeline{bottom:10px;width:calc(100vw - 16px)}
  #legend{display:none}
  #locHint{top:auto;bottom:130px}
  .proj-switch{order:3;width:100%;justify-content:center}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="sealbox serif">时</div>
      <h1 class="serif">时空记忆地图<span class="sub">MemoMap 4D · 世界的时间维</span></h1>
    </div>
    <div class="proj-switch" id="projSwitch"></div>
    <div class="head-right">
      <span class="badge-schema">数据符合 <a href="https://wonderingWu.github.io/ste-schema/v0.1/schema.json" target="_blank">STE Schema v0.1</a></span>
      <span id="userBox"></span>
      <button class="btn" id="locBtn">📍 定位我</button>
    </div>
  </header>
  <div id="projDesc"></div>
  <main>
    <div id="map"></div>
    <div id="locHint" class="panel">📍 已定位</div>
    <div id="legend" class="panel">
      <h4>图例</h4>
      <div><span class="leg-dot leg-dot--alive"></span>该年代存在</div>
      <div><span class="leg-dot leg-dot--dead"></span>该年代已消失</div>
      <div><span class="leg-dot leg-dot--you"></span>你的位置</div>
    </div>
    <div id="card" class="panel">
      <button class="x" id="cardClose">✕</button>
      <div id="card-head"></div>
      <div id="card-body" class="scroll"></div>
    </div>
    <div id="timeline" class="panel">
      <div id="tlTop">
        <div id="tlYear">2026<small>年</small></div>
        <div id="tlHint"></div>
        <button id="tlPlay">▶ 播放</button>
      </div>
      <input type="range" id="tlRange" min="1890" max="2026" value="2026" step="1" />
      <div id="tlEras"></div>
    </div>
    <div id="toast"></div>
  </main>
</div>

<div id="modal">
  <div id="modalBox" class="panel">
    <h3 class="serif" id="modalTitle">添加变迁 / 记忆</h3>
    <div class="sub" id="modalSub">保存到本浏览器 · 参与贡献可获得积分</div>
    <div class="fld" id="typeFld">
      <label>类型</label>
      <div class="seg2" id="typeSeg">
        <button data-t="fact">变迁事实</button>
        <button data-t="text" class="on">文字记忆</button>
        <button data-t="photo">图片</button>
      </div>
    </div>
    <div class="fld" id="yearFld">
      <label>年份（必填，如 1958）</label>
      <input type="number" id="fYear" min="1800" max="2099" placeholder="1958" />
      <div class="err">请填写有效年份</div>
    </div>
    <div class="fld" id="contentFld">
      <label id="contentLabel">内容（必填）</label>
      <textarea id="fContent" placeholder="写下记忆或变迁事实…"></textarea>
      <div class="err">请填写内容</div>
    </div>
    <div class="fld" id="imgFld" style="display:none">
      <label>选择图片（可选）</label>
      <input type="file" id="fImg" accept="image/*" />
      <div id="imgPreview"><img id="fImgPreview" alt="预览" /></div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn primary" id="modalSave">保存贡献</button>
    </div>
    <div class="pts-note" id="ptsNote"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

车后座带过媳妇，也带过一百多斤的大白菜。","price":168,"seed":8},{"place":"隆福寺街","type":"text","year":1983,"author":"吴桂芳 · 1955 年生","title":"隆福寺裁缝铺的毛料套装","text":"改革开放后裁缝铺活泛起来，隆福寺老师傅给做的中山装，垫肩挺括。那年穿着它去广州出差，觉得特有面子。","price":62,"seed":9},{"place":"隆福寺街","type":"text","year":1985,"author":"郑爱民 · 1960 年生","title":"12 寸黑白电视机","text":"1985 年家里第一台电视机，昆仑牌 12 寸黑白。夏天晚上搬到大院里，半条胡同的邻居搬着小板凳来看《射雕英雄传》。","price":420,"seed":10},{"place":"地安门百货商场","type":"text","year":1989,"author":"许文博 · 1965 年生","title":"最后一件中山装","text":"1989 年在地安门百货给父亲买了件成衣中山装，那年之后他自己也改穿夹克和西装了。一个时代的背影。","price":95,"seed":11}]}];
const STATUS_ZH = { active:'存在', demolished:'已消失', under_construction:'在建', proposed:'规划' };
const RULES = { add: 10, confirm: 2, revise: 5 };

/* ============ 工具 ============ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const LS_KEY = (proj, id) => 'ste-contrib-' + proj + '-' + id;
const LS_USER = 'ste-user';

/* 占位老照片（中山装项目种子贡献用） */
const PALETTES=[['#efe6cf','#d9c69c','#4a3b28'],['#e9e0d2','#c9b58f','#41372a'],['#efe3d3','#d3b795','#503f2b'],['#e7ddc6','#cdbf97','#3f3a26'],['#ece2ce','#d2bd93','#473a2c'],['#e6dccf','#c4ad8b','#3d3327']];
function memoryPhoto(title,subtitle,seed){
  const p=PALETTES[Math.abs(seed)%PALETTES.length];
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">'
  +'<defs><linearGradient id="g" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="'+p[0]+'"/><stop offset="1" stop-color="'+p[1]+'"/></linearGradient>'
  +'<filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/></filter>'
  +'<radialGradient id="v" cx="0.5" cy="0.45" r="0.75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#3a2a12" stop-opacity="0.28"/></radialGradient></defs>'
  +'<rect width="640" height="420" fill="url(#g)"/><rect width="640" height="420" filter="url(#n)" opacity="0.07"/><rect width="640" height="420" fill="url(#v)"/>'
  +'<rect x="16" y="16" width="608" height="388" fill="none" stroke="'+p[2]+'" stroke-width="2" opacity="0.5"/>'
  +'<text x="320" y="196" text-anchor="middle" font-family="\'Songti SC\',\'SimSun\',serif" font-size="44" font-weight="700" fill="'+p[2]+'" letter-spacing="6">'+String(title).slice(0,12)+'</text>'
  +'<line x1="220" y1="226" x2="420" y2="226" stroke="'+p[2]+'" stroke-width="1" opacity="0.5"/>'
  +'<text x="320" y="262" text-anchor="middle" font-family="Georgia,\'Songti SC\',serif" font-size="19" fill="'+p[2]+'" opacity="0.75" letter-spacing="3">'+String(subtitle).slice(0,24)+'</text>'
  +'<g transform="translate(548 336)"><rect width="52" height="52" rx="5" fill="#b3452e" opacity="0.88"/><text x="26" y="35" text-anchor="middle" font-family="\'Songti SC\',\'SimSun\',serif" font-size="22" font-weight="700" fill="#f6efe2">忆</text></g></svg>';
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg).replace(/'/g,'%27');
}

/* ============ 状态 ============ */
const S = { proj: null, year: 2026, sel: null, you: null, playing: false };
let map = null, markerLayer = null, youLayer = null, playTimer = null;

/* ============ 用户与积分 ============ */
function getUser() {
  try { return JSON.parse(localStorage.getItem(LS_USER) || 'null'); } catch { return null; }
}
function saveUser(u) { localStorage.setItem(LS_USER, JSON.stringify(u)); }
function renderUser() {
  const u = getUser();
  const box = $('userBox');
  if (u) {
    box.innerHTML = '<span class="user-chip">👤 ' + esc(u.name) + ' · <b>' + u.points + '</b> 积分</span>';
  } else {
    box.innerHTML = '<button class="btn" id="regBtn">注册 / 登录</button>';
    $('regBtn').onclick = showRegister;
  }
}
function addPoints(delta, why) {
  const u = getUser();
  if (!u) return null;
  u.points += delta;
  saveUser(u);
  renderUser();
  toast(why + ' +' + delta + ' 积分');
  return u;
}
function showRegister() {
  const name = prompt('注册昵称（演示环境，数据仅存本浏览器）：', '');
  if (!name || !name.trim()) return;
  saveUser({ name: name.trim().slice(0, 20), points: 100, confirmed: {} });
  renderUser();
  toast('欢迎 ' + name.trim() + '，初始 100 积分');
}

/* ============ 贡献存取 ============ */
function loadContribs(projId, steId) {
  try { return JSON.parse(localStorage.getItem(LS_KEY(projId, steId)) || '[]'); } catch { return []; }
}
function saveContribs(projId, steId, list) {
  localStorage.setItem(LS_KEY(projId, steId), JSON.stringify(list));
}
/* 种子贡献首次注入（中山装项目） */
function seedContribs(proj) {
  if (!proj.seedContribs || localStorage.getItem('ste-seed-' + proj.id)) return;
  for (const sc of proj.seedContribs) {
    const place = proj.entities.find((e) => e.name.primary === sc.place);
    if (!place) continue;
    const list = loadContribs(proj.id, place.ste_id);
    list.push({
      id: 'seed-' + sc.seed,
      type: sc.type, year: sc.year, author: sc.author,
      title: sc.title, content: sc.text,
      price: sc.price ?? null,
      image: memoryPhoto(sc.title || '记忆旧照', sc.year + ' · ' + sc.place, sc.seed),
      seed: true, createdAt: '2026-07-1' + (sc.seed % 9 + 1) + 'T10:00:00',
    });
    saveContribs(proj.id, place.ste_id, list);
  }
  localStorage.setItem('ste-seed-' + proj.id, '1');
}

/* ============ 项目 ============ */
function switchProj(id) {
  S.proj = PROJECTS.find((p) => p.id === id);
  S.sel = null;
  $('card').classList.remove('show');
  seedContribs(S.proj);
  document.querySelectorAll('#projSwitch button').forEach((b) => b.classList.toggle('on', b.dataset.id === id));
  $('projDesc').textContent = '项目：' + S.proj.name + ' · ' + S.proj.desc;
  buildEras();
  renderMarkers();
  setYear(S.proj.kind === 'memories' ? 1980 : 2026, { silent: true });
  const c = S.proj.entities[0].coordinates;
  map.setView([c.lat, c.lon], S.proj.kind === 'memories' ? 12 : 5);
  const bounds = L.latLngBounds(S.proj.entities.map((e) => [e.coordinates.lat, e.coordinates.lon]));
  map.fitBounds(bounds, { padding: [70, 70], maxZoom: 13 });
  $('tlHint').textContent = S.proj.kind === 'memories' ? '← 拖动筛选记忆年份（±3 年）' : '← 拖动时间轴，看它一生的变迁';
}

/* ============ 地图 ============ */
function initMap() {
  map = L.map('map', { zoomControl: true }).setView([39.91, 116.40], 5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OSM' }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
  youLayer = L.layerGroup().addTo(map);
}
function covers(sn, year) {
  const s = parseInt(sn.start_date, 10);
  const e = sn.end_date ? parseInt(sn.end_date, 10) : 2026;
  return year >= s && year <= e;
}
function snapAt(e, year) { return e.timeline.find((sn) => covers(sn, year)) || null; }
function aliveAt(e, year) { const sn = snapAt(e, year); return sn ? sn.status === 'active' : false; }
function activeNameAt(e, year) { const sn = snapAt(e, year); return sn ? sn.name : null; }
function contribsNear(e, year) {
  return loadContribs(S.proj.id, e.ste_id).filter((c) => Math.abs((c.year || 0) - year) <= 3);
}

function markerIcon(e, sel) {
  const proj = S.proj;
  let count, cls, nm;
  if (proj.kind === 'memories') {
    const n = contribsNear(e, S.year).length;
    count = n > 0 ? String(n) : '·';
    cls = sel ? 'mm-marker--sel' : (n > 0 ? 'mm-marker--alive' : 'mm-marker--dead');
    nm = e.name.primary;
  } else {
    const alive = aliveAt(e, S.year);
    count = e.name.primary[0];
    cls = sel ? 'mm-marker--sel' : (alive ? 'mm-marker--alive' : 'mm-marker--dead');
    nm = activeNameAt(e, S.year) || e.name.primary;
  }
  return L.divIcon({
    className: 'mm-icon',
    html: '<div class="mm-marker ' + cls + '"><div class="mm-marker-count">' + esc(count) + '</div><div class="mm-marker-name' + (S.year >= 2020 ? '' : ' ghost') + '">' + esc(nm) + '</div></div>',
    iconSize: [34, 34], iconAnchor: [17, 17],
  });
}
function renderMarkers() {
  markerLayer.clearLayers();
  for (const e of S.proj.entities) {
    const m = L.marker([e.coordinates.lat, e.coordinates.lon], { icon: markerIcon(e, S.sel === e.ste_id) });
    m.on('click', () => openCard(e));
    markerLayer.addLayer(m);
  }
}
function setYou(pos) {
  youLayer.clearLayers();
  if (!pos) return;
  S.you = pos;
  L.marker([pos.lat, pos.lon], { icon: L.divIcon({ className: '', html: '<div class="you-marker"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }) }).addTo(youLayer);
}
function locate() {
  if (!navigator.geolocation) { toast('此浏览器不支持定位'); return; }
  const btn = $('locBtn');
  btn.disabled = true; btn.textContent = '定位中…';
  navigator.geolocation.getCurrentPosition(
    (p) => {
      setYou({ lat: p.coords.latitude, lon: p.coords.longitude });
      map.setView([p.coords.latitude, p.coords.longitude], 12);
      $('locHint').style.display = 'block';
      toast('已定位到你的位置');
      btn.disabled = false; btn.textContent = '📍 重新定位';
    },
    () => { toast('定位失败，已显示项目默认区域'); btn.disabled = false; btn.textContent = '📍 定位我'; },
    { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 },
  );
}

/* ============ 时间轴 ============ */
function buildEras() {
  const years = [];
  for (const e of S.proj.entities) for (const sn of e.timeline) {
    const y = parseInt(sn.start_date, 10);
    if (!isNaN(y)) years.push(y);
    if (sn.end_date) { const y2 = parseInt(sn.end_date, 10); if (!isNaN(y2)) years.push(y2); }
  }
  const lo = Math.max(1800, Math.floor(Math.min(...years) / 10) * 10);
  const hi = 2026;
  $('tlRange').min = lo; $('tlRange').max = hi;
  const box = $('tlEras');
  const step = Math.max(10, Math.round((hi - lo) / 5 / 10) * 10);
  let parts = '';
  for (let y = lo; y <= hi; y += step) parts += '<b>' + y + '</b>';
  box.innerHTML = parts + '<b>' + hi + '</b>';
}
function setYear(y, opts = {}) {
  S.year = y;
  $('tlRange').value = y;
  $('tlYear').innerHTML = y + '<small>年</small>';
  renderMarkers();
  if (S.sel) renderCard(S.sel, opts.silent);
  if (!opts.silent && S.sel) {
    if (S.proj.kind === 'memories') {
      const n = contribsNear(S.sel, y).length;
      toast(y + ' 年附近有 ' + n + ' 条记忆');
    } else {
      const sn = snapAt(S.sel, y);
      toast(sn ? y + ' 年：' + sn.name + '（' + (STATUS_ZH[sn.status] || sn.status) + '）' : y + ' 年：暂无记录');
    }
  }
}
function play() {
  if (S.playing) { S.playing = false; $('tlPlay').textContent = '▶ 播放'; clearInterval(playTimer); return; }
  S.playing = true;
  $('tlPlay').textContent = '⏸ 暂停';
  if (S.year >= 2026) setYear(parseInt($('tlRange').min, 10), { silent: true });
  playTimer = setInterval(() => {
    if (S.year >= 2026) { S.playing = false; $('tlPlay').textContent = '▶ 播放'; clearInterval(playTimer); return; }
    setYear(S.year + 1, { silent: true });
  }, 260);
}

/* ============ 卡片 ============ */
function openCard(e) {
  S.sel = e;
  renderCard(e);
  $('card').classList.add('show');
}
function closeCard() {
  $('card').classList.remove('show');
  S.sel = null;
  renderMarkers();
}
function renderCard(e, silent) {
  const head = $('card-head');
  head.innerHTML =
    '<div class="kicker">' + esc(e.tags.city || '') + (e.tags['ste:disappearance'] ? ' · ' + esc(e.tags['ste:disappearance']) : '') + '</div>' +
    '<h2 class="serif">' + esc(e.name.primary) + '</h2>' +
    '<div class="steid mono">' + e.ste_id + '</div>';
  const body = $('card-body');
  let h = '';

  if (S.proj.kind === 'timeline') {
    const sn = snapAt(e, S.year);
    if (sn) {
      const dead = sn.status !== 'active';
      h += '<div id="curSnap"><div class="when">' + S.year + ' 年 · 该年代快照</div>' +
        '<div class="what">' + esc(sn.name) + '<span class="st' + (dead ? ' dead' : '') + '">' + (STATUS_ZH[sn.status] || sn.status) + '</span></div>' +
        (sn.description ? '<div class="desc">' + esc(sn.description) + '</div>' : '') + '</div>';
    } else {
      h += '<div id="curSnap"><div class="when">' + S.year + ' 年</div><div class="what">此年代无记录<span class="st dead">未知</span></div></div>';
    }
    h += '<div class="subtitle">完整时间线（点击定位到该年代）</div><div class="tl">';
    for (const s of e.timeline) {
      const cur = covers(s, S.year);
      h += '<div class="tl-item st-' + esc(s.status) + (cur ? ' cur' : '') + '" data-y="' + esc(s.start_date) + '">' +
        '<div class="tl-range">' + esc(s.start_date) + ' → ' + (s.end_date ? esc(s.end_date) : '至今') +
        '<span class="tl-status st-' + esc(s.status) + '">' + (STATUS_ZH[s.status] || s.status) + '</span></div>' +
        '<div class="tl-name">' + esc(s.name) + '</div></div>';
    }
    h += '</div>';
  } else {
    /* memories 模式：地点快照简表 + 记忆列表 */
    const sn0 = e.timeline[0];
    h += '<div id="curSnap"><div class="when">' + esc(e.tags['amenity'] || 'place') + ' · ' + esc(sn0.start_date) + ' 至今</div>' +
      '<div class="what">' + esc(sn0.name) + '<span class="st">存在</span></div>' +
      (sn0.description ? '<div class="desc">' + esc(sn0.description) + '</div>' : '') + '</div>';
    h += '<div class="subtitle">该年代（' + (S.year - 3) + '–' + (S.year + 3) + '）附近的记忆</div>';
  }

  /* 贡献列表 */
  const contribs = loadContribs(S.proj.id, e.ste_id);
  const u = getUser();
  h += '<div class="subtitle">' + (S.proj.kind === 'memories' ? '全部记忆与补充' : '记忆与补充') + '（' + contribs.length + '）</div>';
  if (contribs.length === 0) {
    h += '<div id="contribEmpty">还没有内容。点击下方按钮添加图片、文字或变迁事实</div>';
  } else {
    h += '<div id="contribs">';
    const sorted = [...contribs].sort((a, b) => (a.year || 0) - (b.year || 0));
    for (const c of sorted) {
      const near = Math.abs((c.year || 0) - S.year) <= 3;
      const style = (S.proj.kind === 'memories' && !near) ? 'opacity:.4' : '';
      const mine = u && (c.author === u.name || c.byMe);
      const confirmed = u && u.confirmed[c.id];
      h += '<div class="contrib" style="' + style + '"><div class="c-head">' +
        '<span class="c-type">' + (c.type === 'photo' ? '图片' : c.type === 'text' ? '记忆' : '变迁') + '</span>' +
        '<span class="c-year">' + esc(c.year || '?') + ' 年</span>' +
        '<span class="c-author">' + esc(c.author || (c.seed ? '种子数据' : '匿名')) + '</span>' +
        (c.price != null ? '<span class="c-price">当年 ￥' + esc(c.price) + '</span>' : '') +
        '<span class="c-acts">' +
        (c.confirms ? '<span class="c-meta" style="margin:0 2px">✓' + c.confirms + '</span>' : '') +
        (c.seed || mine ? '' : '<button class="c-act' + (confirmed ? ' done' : '') + '" data-act="ok" data-id="' + esc(c.id) + '">' + (confirmed ? '已确认' : '确认 +' + RULES.confirm) + '</button>') +
        (c.seed ? '' : '<button class="c-act" data-act="edit" data-id="' + esc(c.id) + '">修订 +' + RULES.revise + '</button>') +
        (mine && !c.seed ? '<button class="c-act del" data-act="del" data-id="' + esc(c.id) + '">删除</button>' : '') +
        '</span></div>' +
        (c.title ? '<div><b>' + esc(c.title) + '</b></div>' : '') +
        (c.content ? '<div>' + esc(c.content) + '</div>' : '') +
        (c.image ? '<img src="' + c.image + '" alt="记忆图片" />' : '') +
        (c.revisedBy ? '<div class="c-meta">已由 ' + esc(c.revisedBy) + ' 修订</div>' : '') +
        '</div>';
    }
    h += '</div>';
  }
  h += '<div style="margin-top:12px"><button class="btn primary" id="addBtn" style="width:100%">＋ 添加图片 / 文字 / 变迁事实</button></div>';
  h += '<div class="data-foot" style="margin-top:12px;padding-top:10px;border-top:1px dashed rgba(43,38,32,.15);font-size:10px;color:var(--ink-faint);line-height:1.7">' +
    'STE Schema v0.1 · 实体含 ste_id / timeline 快照 / 坐标 · 参与确认/修订/添加均可获得积分<br/>' +
    'schema: <span class="mono">wonderingWu.github.io/ste-schema/v0.1/schema.json</span></div>';
  body.innerHTML = h;

  if (S.proj.kind === 'timeline') {
    body.querySelectorAll('.tl-item').forEach((el) => (el.onclick = () => setYear(parseInt(el.dataset.y, 10))));
  }
  body.querySelectorAll('[data-act="ok"]').forEach((el) => (el.onclick = () => confirmContrib(e, el.dataset.id)));
  body.querySelectorAll('[data-act="edit"]').forEach((el) => (el.onclick = () => openModal(e, el.dataset.id)));
  body.querySelectorAll('[data-act="del"]').forEach((el) => (el.onclick = () => removeContrib(e, el.dataset.id)));
  $('addBtn').onclick = () => openModal(e, null);
}

/* ============ 贡献操作 ============ */
function confirmContrib(e, id) {
  const u = getUser();
  if (!u) { showRegister(); return; }
  if (u.confirmed[id]) return;
  const list = loadContribs(S.proj.id, e.ste_id);
  const c = list.find((x) => x.id === id);
  if (!c || c.seed) return;
  c.confirms = (c.confirms || 0) + 1;
  saveContribs(S.proj.id, e.ste_id, list);
  u.confirmed[id] = true;
  saveUser(u);
  renderUser();
  renderCard(e);
  toast('已确认该贡献，+' + RULES.confirm + ' 积分');
}
function removeContrib(e, id) {
  const list = loadContribs(S.proj.id, e.ste_id).filter((c) => c.id !== id);
  saveContribs(S.proj.id, e.ste_id, list);
  if (S.sel) renderCard(S.sel);
  toast('已删除');
}

/* ============ 采集/修订表单 ============ */
const FORM = { type: 'text', ste: null, editId: null };
function openModal(e, editId) {
  const u = getUser();
  if (!u) { showRegister(); return; }
  FORM.ste = e;
  FORM.editId = editId;
  FORM.editSrc = null;
  if (editId) {
    const list = loadContribs(S.proj.id, e.ste_id);
    FORM.editSrc = list.find((x) => x.id === editId) || null;
  }
  const isEdit = !!editId;
  $('modalTitle').textContent = isEdit ? '修订贡献' : '添加变迁 / 记忆';
  $('modalSub').textContent = isEdit ? ('修订他人内容 +' + RULES.revise + ' 积分') : ('保存到本浏览器 · 添加贡献 +' + RULES.add + ' 积分');
  $('ptsNote').textContent = '积分规则：添加 +' + RULES.add + ' · 确认 +' + RULES.confirm + ' · 修订 +' + RULES.revise;
  resetForm(isEdit);
  $('modal').classList.add('show');
}
function resetForm(isEdit) {
  FORM.type = 'text';
  $('fYear').value = isEdit ? (FORM.editSrc && FORM.editSrc.year) || S.year : S.year;
  $('fContent').value = isEdit ? (FORM.editSrc && FORM.editSrc.content) || '' : '';
  $('fImg').value = '';
  $('imgPreview').classList.remove('show');
  $('imgFld').style.display = 'none';
  $('typeFld').style.display = isEdit ? 'none' : 'block';
  syncTypeSeg();
}
function syncTypeSeg() {
  document.querySelectorAll('#typeSeg button').forEach((b) => b.classList.toggle('on', b.dataset.t === FORM.type));
  $('imgFld').style.display = FORM.type === 'photo' ? 'block' : 'none';
  $('contentLabel').textContent = FORM.type === 'fact' ? '变迁事实内容（必填）' : FORM.type === 'text' ? '文字记忆（必填）' : '图片说明（选填）';
  $('fContent').placeholder = FORM.type === 'fact' ? '如：这一年学校西迁至西安…' : FORM.type === 'text' ? '写下你或家人的记忆…' : '这张照片拍的什么？';
}
function closeModal() { $('modal').classList.remove('show'); }

function saveContribution() {
  const u = getUser();
  if (!u) return;
  const year = parseInt($('fYear').value, 10);
  const content = $('fContent').value.trim();
  let invalid = false;
  $('yearFld').classList.toggle('invalid', !(year >= 1800 && year <= 2099));
  if (!(year >= 1800 && year <= 2099)) invalid = true;
  $('contentFld').classList.toggle('invalid', FORM.type !== 'photo' && !content);
  if (FORM.type !== 'photo' && !content) invalid = true;
  if (invalid) return;
  const img = $('fImgPreview').src || null;
  const list = loadContribs(S.proj.id, FORM.ste.ste_id);
  if (FORM.editId) {
    const c = list.find((x) => x.id === FORM.editId);
    if (c) {
      c.content = content || c.content;
      c.year = year || c.year;
      if (img) c.image = img;
      c.revisedBy = u.name;
      addPoints(RULES.revise, '修订贡献');
    }
  } else {
    list.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      type: FORM.type, year: year || null, author: u.name, byMe: true,
      content: content || null, image: img, createdAt: new Date().toISOString(),
    });
    addPoints(RULES.add, '添加贡献');
  }
  saveContribs(S.proj.id, FORM.ste.ste_id, list);
  closeModal();
  renderCard(FORM.ste);
}

/* ============ 杂项 ============ */
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ============ 绑定 ============ */
function bind() {
  /* 项目切换 */
  const sw = $('projSwitch');
  for (const p of PROJECTS) {
    const b = document.createElement('button');
    b.textContent = p.name;
    b.dataset.id = p.id;
    b.onclick = () => switchProj(p.id);
    sw.appendChild(b);
  }
  $('tlRange').oninput = (ev) => setYear(parseInt(ev.target.value, 10), { silent: true });
  $('tlPlay').onclick = play;
  $('locBtn').onclick = locate;
  $('cardClose').onclick = closeCard;
  $('modalCancel').onclick = closeModal;
  $('modalSave').onclick = saveContribution;
  $('fImg').onchange = (ev) => {
    const f = ev.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { $('fImgPreview').src = rd.result; $('imgPreview').classList.add('show'); };
    rd.readAsDataURL(f);
  };
  document.querySelectorAll('#typeSeg button').forEach((b) => (b.onclick = () => { FORM.type = b.dataset.t; syncTypeSeg(); }));
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { closeModal(); closeCard(); } });
}

/* ============ 启动 ============ */
function boot() {
  initMap();
  bind();
  renderUser();
  switchProj(PROJECTS[0].id);
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (p) => { setYou({ lat: p.coords.latitude, lon: p.coords.longitude }); $('locHint').style.display = 'block'; },
      () => {}, { timeout: 6000, maximumAge: 120000 },
    );
  }
}
boot();
</script>
</body>
</html>
